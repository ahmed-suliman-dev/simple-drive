# Local services for trying the S3 and FTP backends.
#   docker compose up -d
# The Rails app itself runs on the host (bin/rails server).
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console: http://localhost:9001
    volumes:
      - minio-data:/data

  # Creates the bucket once MinIO is up, then exits.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/simple-drive;
      "

  ftp:
    image: delfer/alpine-ftp-server:latest
    environment:
      USERS: "ftpuser|ftppass"
      ADDRESS: localhost
      MIN_PORT: 21000
      MAX_PORT: 21010
    ports:
      - "21:21"
      - "21000-21010:21000-21010"

volumes:
  minio-data:
